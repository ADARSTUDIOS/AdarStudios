<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galerie – Adar Studios</title>
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at top, #000 60%, #001f3f);
      color: #fff;
      font-family: "Poppins", sans-serif;
      overflow-x: hidden;
    }

    /* ===== INTRO ===== */
    .intro {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #001933, #000);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      animation: fadeOut 2s ease 3.5s forwards;
      z-index: 9999;
    }
    .intro img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 15px;
      box-shadow: 0 0 40px rgba(0, 170, 255, 0.5);
      animation: glow 2s ease-in-out infinite alternate;
    }
    .intro h1 {
      font-size: 2.8rem;
      color: #facc15;
      text-shadow: 0 0 30px rgba(250, 204, 21, 0.6);
      opacity: 0;
      animation: appear 2s ease 0.8s forwards;
    }
    .intro span {
      font-size: 1rem;
      color: #00aaff;
      margin-top: 10px;
      opacity: 0;
      animation: appear 2s ease 1.8s forwards;
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }
    @keyframes glow {
      from { box-shadow: 0 0 15px rgba(0, 170, 255, 0.3); }
      to { box-shadow: 0 0 40px rgba(0, 170, 255, 0.8); }
    }

    /* ===== HEADER ===== */
    header {
      display: flex;
      align-items: center;
      padding: 15px 40px;
      position: sticky;
      top: 0;
      backdrop-filter: blur(12px);
      background: rgba(255, 255, 255, 0.05);
      z-index: 100;
    }

    .back-btn {
      padding: 10px 20px;
      border-radius: 30px;
      text-decoration: none;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: 0.3s;
      font-weight: 600;
    }
    .back-btn:hover {
      background: rgba(0, 153, 255, 0.4);
      box-shadow: 0 0 15px #00aaff;
      transform: translateY(-3px);
    }

    /* ===== TITRE ===== */
    h1 {
      text-align: center;
      margin: 40px 0 10px;
      font-size: 2.2rem;
      color: #facc15;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
    }
    p.subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 50px;
      font-size: 1rem;
    }

    /* ===== GALERIE ===== */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      width: 90%;
      margin: auto;
    }

    .item {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(6px);
      transition: 0.4s;
      cursor: pointer;
    }

    .item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.4s;
    }

    .item:hover img {
      transform: scale(1.1);
      opacity: 0.9;
    }

    .caption {
      position: absolute;
      bottom: 0;
      width: 100%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.6);
      color: #facc15;
      font-weight: 600;
      text-align: center;
      font-size: 1rem;
    }

    /* ===== POPUP IMAGE ===== */
    .popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .popup img {
      width: 80%;
      max-width: 900px;
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(0, 153, 255, 0.5);
      animation: zoomIn 0.6s ease;
    }

    @keyframes zoomIn {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* ===== FOOTER ===== */
    footer {
      text-align: center;
      padding: 20px;
      color: #888;
      background: rgba(255, 255, 255, 0.05);
      margin-top: 60px;
      font-size: 0.9rem;
    }

    /* ===== FADE ANIMATION ===== */
    .fade {
      opacity: 0;
      transform: translateY(30px);
      transition: 0.8s;
    }
    .fade.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.7rem; }
      .back-btn { padding: 8px 16px; font-size: 0.9rem; }
      .intro img { width: 90px; height: 90px; }
      .popup img { width: 90%; }
    }
  </style>
</head>
<body>

  <!-- INTRO -->
  <div class="intro">
    <audio id="introSound" src="sound/intro.mp3"></audio>
    <img src="images/logo.png" alt="Logo Adar Studios">
    <h1>ADAR STUDIOS</h1>
    <span>Chargement de la galerie...</span>
  </div>

  <!-- HEADER -->
  <header>
    <a href="index.html" class="back-btn">⬅ Retour au site</a>
  </header>

  <h1>Galerie : Créations de Adar Studios</h1>
  <p class="subtitle">Découvrez mes affiches, logos et visuels créatifs</p>

  <div class="gallery">
    <a href="https://ibb.co/GQCTD0WN"><img src="https://i.ibb.co/GQCTD0WN/t-l-charg-8.jpg" alt="t-l-charg-8" border="0"></a>
    <div class="item fade"><img src="images/projet1b.jpg" alt=""><div class="caption">Logo Concept</div></div>
    <div class="item fade"><img src="images/projet1c.jpg" alt=""><div class="caption">Série Artistique</div></div>
    <div class="item fade"><img src="images/projet1d.jpg" alt=""><div class="caption">Direction Photo</div></div>
    <div class="item fade"><img src="images/projet1e.jpg" alt=""><div class="caption">Affiche Digitale</div></div>
    <div class="item fade"><img src="images/projet1f.jpg" alt=""><div class="caption">Design Créatif</div></div>
  </div>

  <div class="popup" id="popup">
    <img src="" alt="Zoom" />
  </div>

  <footer>© 2025 ADAR STUDIOS – Tous droits réservés.</footer>

  <script>
    // Effet fade au scroll
    const fades = document.querySelectorAll(".fade");
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add("visible");
      });
    }, { threshold: 0.2 });
    fades.forEach(el => observer.observe(el));

    // Popup d'image
    const popup = document.getElementById("popup");
    const popupImg = popup.querySelector("img");
    document.querySelectorAll(".item img").forEach(img => {
      img.addEventListener("click", () => {
        popupImg.src = img.src;
        popup.style.display = "flex";
      });
    });
    popup.addEventListener("click", () => popup.style.display = "none");

    // Son d’intro
    window.addEventListener("load", () => {
      const sound = document.getElementById("introSound");
      sound.volume = 0.4;
      setTimeout(() => sound.play(), 300); // petit délai pour la synchronisation
    });
  </script>
</body>
</html>
